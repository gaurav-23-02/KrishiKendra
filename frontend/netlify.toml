[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy API calls to backend
[[redirects]]
  from = "/api/*"
  to = "https://krishi-kendra-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router pages
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
