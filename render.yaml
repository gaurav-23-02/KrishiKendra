services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: krishi-kendra-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: CORS_ALLOWED_ORIGINS
        value: https://krishi-kendra-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: SERVER_PORT
        value: 8080

  # 2. React Frontend Static Site
  - type: web
    name: krishi-kendra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /api/*
        destination: https://krishi-kendra-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
